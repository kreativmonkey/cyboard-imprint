manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: Cyboard-DigitalTailor
      url-base: https://github.com/Cyboard-DigitalTailor
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # ZMK main, 2026-10-09 (Zephyr 4.1). Update deliberately after testing.
      revision: 4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
      import: app/west.yml
    - name: zmk-keyboards
      remote: Cyboard-DigitalTailor
      # Cyboard's zephyr-4.1 branch; main still targets ZMK 0.3.
      revision: 01f5cf9a1bb8fc64eae8c5c9400823025b1dc3de
      import: config/west.yml
    - name: zmk-pmw3610-driver
      remote: Cyboard-DigitalTailor
      # Pin the trackball driver instead of the imported moving branch.
      revision: 3fe2d16c69ca66719a983fa8f95913c263a708fe
    - name: zephyr
      remote: zmkfirmware
      # Freeze v4.1.0+zmk-fixes too; retain ZMK's upstream import exclusions.
      revision: 10ba6d0cb38bc3d258775d27982f707599320085
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
  self:
    path: config
